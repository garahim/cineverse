<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineVerse — Movies, Series &amp; Anime</title><meta name="description" content="CineVerse — discover movies, series and anime, rate them, write reviews and build your watchlist."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127909;</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070c;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);
  --text:#f1f1f4;--muted:#9a9aa8;--rose:#f43f5e;--violet:#8b5cf6;--amber:#fbbf24;
  --grad:linear-gradient(90deg,#f43f5e,#8b5cf6);
}
html{scroll-behavior:smooth}
@keyframes heroIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:"Sora","Inter",sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* nav */
nav{position:sticky;top:0;z-index:50;background:rgba(7,7,12,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:22px}
.logo{font-size:20px;font-weight:800;letter-spacing:.5px}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:8px 12px;border-radius:10px;font-size:14px;color:var(--muted);transition:.15s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.06)}
.search-wrap{position:relative}
.search-wrap input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 38px;color:#fff;font-size:14px;outline:none;width:230px;transition:.15s}
.search-wrap input:focus{border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.burger{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;cursor:pointer;border:2px solid rgba(255,255,255,.25)}
.acct-wrap{position:relative}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:#12121c;border:1px solid var(--line);border-radius:14px;min-width:200px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:fade .15s ease}
.dropdown a,.dropdown button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:9px;font-size:14px;color:#cfcfd8;background:none;border:0;cursor:pointer;text-align:left;font-family:inherit}
.dropdown a:hover,.dropdown button:hover{background:rgba(255,255,255,.07);color:#fff}
.dropdown .sep{border-top:1px solid var(--line);margin:5px 0}
.dropdown .danger{color:#fda4af}
.dropdown .danger:hover{background:rgba(244,63,94,.1)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(244,63,94,.35)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn-danger{background:rgba(244,63,94,.15);color:#fda4af;border:1px solid rgba(244,63,94,.4)}
.btn-danger:hover{background:rgba(244,63,94,.25)}

/* hero */
.hero{position:relative;min-height:72vh;display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,12,.15) 0%,rgba(7,7,12,.35) 55%,var(--bg) 100%)}
.hero-content{position:relative;max-width:1200px;margin:0 auto;padding:60px 20px;width:100%;animation:heroIn .6s ease}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
.hero-content h1{font-size:clamp(34px,6vw,64px);line-height:1.05;margin:14px 0;max-width:700px}
.hero-tag{color:var(--muted);max-width:560px;font-size:16px}
.hero-meta{margin-top:14px;font-size:14px;color:var(--muted)}
.hero-cta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.hero-dots{position:absolute;right:20px;bottom:26px;display:flex;gap:8px}
.hero-dots button{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;cursor:pointer;transition:.2s}
.hero-dots button.on{background:#fff;border-color:#fff}

/* sections */
.section{max-width:1200px;margin:0 auto;padding:0 20px 14px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 14px}
.section-head h2{font-size:22px}
.see-all{font-size:13px;color:var(--violet);font-weight:600}
.row{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{height:8px}
.row::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.pcard{flex:0 0 148px;scroll-snap-align:start;cursor:pointer;position:relative;transition:transform .15s}
.pcard:hover{transform:translateY(-5px)}
.pcard .poster{background:var(--card);border-radius:12px;aspect-ratio:2/3;overflow:hidden;border:1px solid var(--line);position:relative}
.pcard .poster img{width:100%;height:100%;object-fit:cover}
.pcard .score{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--amber)}
.pcard .wbtn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;border:0;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
.pcard:hover .wbtn{opacity:1}
.pcard .wbtn.on{opacity:1;color:var(--rose)}
.pcard h3{font-size:14px;margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard p{font-size:12px;color:var(--muted)}

/* explore */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 20px;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{color:#fff}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.toolbar select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;outline:none}
.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px}

/* detail */
.back{margin:20px 0;display:inline-flex;gap:8px;color:var(--muted);font-size:14px}
.back:hover{color:#fff}
.detail-hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px}
.detail-hero .bg{height:340px;background-size:cover;background-position:center}
.detail-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,12,.2),rgba(7,7,12,.92))}
.detail-head{position:absolute;left:0;right:0;bottom:0;padding:22px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.detail-head img{width:130px;border-radius:12px;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.detail-head h1{font-size:clamp(26px,4vw,42px);line-height:1.1}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.meta .chip2{background:rgba(255,255,255,.1);padding:3px 10px;border-radius:999px}
.scorebox{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
.score-item .big{font-size:26px;font-weight:800;color:var(--amber)}
.score-item .lbl{font-size:12px;color:var(--muted)}
.detail-body{display:grid;grid-template-columns:1fr 380px;gap:30px}
.detail-body h3{font-size:18px;margin:24px 0 10px}
.overview{color:#cfcfd8;font-size:15px}
.tagline{font-style:italic;color:var(--muted);margin-bottom:8px;font-size:14px}
.cast{display:flex;flex-wrap:wrap;gap:10px}
.cast span{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:13px}
.cast b{display:block;font-size:13px}
.cast i{font-style:normal;color:var(--muted);font-size:12px}
.widget{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.widget h3{margin:0 0 6px !important}
.starline{font-size:34px;letter-spacing:4px;color:#3a3a45;margin:4px 0 12px}
.starline .on{color:var(--amber)}
.pills{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);border-radius:10px;padding:10px 0;text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.pill:hover{color:#fff}
.pill.sel{background:var(--grad);color:#fff;border-color:transparent}
.widget textarea{width:100%;margin-top:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px;font:inherit;font-size:14px;resize:vertical;min-height:90px;outline:none}
.widget textarea:focus{border-color:rgba(139,92,246,.6)}
.widget .save{margin-top:10px}

/* auth + forms */
.auth-wrap{max-width:430px;margin:40px auto 0;padding:0 20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px}
.auth-card h1{font-size:24px;text-align:center}
.auth-card .sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#cfcfd8;margin-bottom:6px}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:11px 14px;color:#fff;font:inherit;font-size:14px;outline:none}
.field input:focus{border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.err{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.4);color:#fda4af;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.auth-switch a{color:var(--violet);font-weight:600}
.btn-block{width:100%;justify-content:center;margin-top:6px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.colors button.on{border-color:#fff;transform:scale(1.1)}

/* account */
.page{max-width:1200px;margin:0 auto;padding:30px 20px 60px}
.page h1{font-size:30px;margin-bottom:4px}
.account-head{display:flex;gap:18px;align-items:center;margin:18px 0 26px}
.account-head .avatar{width:64px;height:64px;font-size:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat .num{font-size:26px;font-weight:800}
.stat .lbl{font-size:12px;color:var(--muted)}
.account-body{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.panel h3{margin:0 0 16px;font-size:18px}
.recent{display:flex;flex-direction:column;gap:10px}
.recent .rv{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px}
.recent img{width:44px;border-radius:8px}
.recent .tt{font-size:14px;font-weight:600}
.recent .sc{font-size:13px;color:var(--amber);font-weight:700}
.recent .rvw{font-size:12px;color:var(--muted)}
.reviews-list{display:flex;flex-direction:column;gap:10px}
.reviews-list .rv{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.reviews-list b{color:var(--violet)}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);margin-top:24px}
.empty b{color:var(--text);display:block;margin-top:8px}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:860px){
  .nav-links{display:none}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:rgba(10,10,16,.97);padding:12px 20px 18px;border-bottom:1px solid var(--line)}
  .burger{display:block}
  .search-wrap{display:none}
  .account-body{grid-template-columns:1fr}
  .detail-body{grid-template-columns:1fr}
}
@media(max-width:520px){.search-wrap{display:block;width:100%}.nav-inner{flex-wrap:wrap}.hero{min-height:60vh}}

      + '<a class="logo" href="#/"><span>Cine</span>Verse</a>'
      + '<div class="nav-links" id="navLinks"><a href="#/">Home</a><a href="#/explore?type=all&amp;sort=rating">Movies</a><a href="#/explore?type=tv&amp;sort=rating">TV</a><a href="#/explore?type=anime&amp;sort=rating">Anime</a></div>'
      + '<div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'
      + '<input id="searchInput" placeholder="Search titles…" autocomplete="off"></div>'
      + accountHtml
      + '<button class="burger" id="burger" aria-label="Menu">&#8801;</button></div></nav>';
    const burger = document.getElementById("burger");
    if (burger) burger.onclick = () => document.getElementById("navLinks").classList.toggle("open");
    const si = document.getElementById("searchInput");
    if (si) si.addEventListener("keydown", e => { if (e.key === "Enter"){ location.hash = "#/search?q=" + encodeURIComponent(si.value); } });
    if (u){ document.addEventListener("click", e => { const m = document.getElementById("menu"); if (m && !e.target.closest(".acct-wrap")) m.style.display = "none"; }); }
    document.querySelectorAll(".nav-links a").forEach(a => {
      const href = a.getAttribute("href");
      const h = location.hash;
      if (href === "#/" && h === "#/") a.classList.add("active");
      if (href.indexOf("explore") > -1 && h.indexOf("explore") > -1) a.classList.add("active");
    });
  }

  function heroHTML(pool, i){
    const t = pool[i];
    const u = currentUser();

    return '<div class="hero-dots">' + pool.map((p, k) => '<button class="' + (k===i?"on":"") + '"></button>').join("") + '</div>'
      + '<div class="hero-bg" style="background-image:url(\'' + t.backdrop + '\')"></div>'
      + '<div class="hero-content"><span class="hero-kicker">Featured on CineVerse</span>'
      + '<h1>' + esc(t.title) + '</h1>'
      + '<p class="hero-tag">' + esc(t.tagline || t.overview) + '</p>'
      + '<div class="hero-meta">' + t.year + " &middot; " + (t.runtime || "") + " &middot; " + t.genres.join(" / ") + '</div>'
      + '<div class="hero-cta">'
      + '<button class="btn btn-primary" onclick="CINE.goTitle(\'' + t.id + '\')" style="color:#fff">'
      + '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg> Watch</button>'
      + '<button class="btn btn-ghost" onclick="CINE.toggleW(\'' + t.id + '\')">' + (u && watchOf(u.username).includes(t.id) ? "&#10003; In watchlist" : "+ Watchlist") + '</button>'
      + '</div></div>';
  }

  function homeView(){
    const featured = DATA.titles.filter(t => t.featured).slice(0, 5);
    const pool = featured.length ? featured : DATA.titles.slice(0, 5);
    const rows = (heading, type) => {
      const list = DATA.titles.filter(t => t.type === type).slice(0, 12);
      return '<div class="section"><div class="section-head"><h2>' + heading + '</h2>'
        + '<a class="see-all" href="#/explore?type=' + type + '">See all &#8594;</a></div>'
        + '<div class="row">' + list.map(posterCard).join("") + '</div></div>';
    };
    return '<section class="hero" id="hero">' + heroHTML(pool, 0) + '</section>'
      + rows("Trending now", "movie")
      + rows("Featured series", "tv")
      + rows("Anime favourites", "anime")
      + '<div class="section"><div class="section-head"><h2>Browse the catalogue</h2><a class="see-all" href="#/explore">Open explore &#8594;</a></div>'
      + '<div class="row">' + DATA.titles.slice(0, 20).map(posterCard).join("") + '</div></div>';
  }

  function exploreView(type, genre, sort){
    type = type || "all"; genre = genre || ""; sort = sort || "rating";
    let list = DATA.titles.filter(t => (type === "all" || t.type === type) && (!genre || t.genres.includes(genre)));
    if (sort === "rating") list = [...list].sort((a,b) => b.rating - a.rating);
    else if (sort === "year") list = [...list].sort((a,b) => b.year.localeCompare(a.year));
    else list = [...list].sort((a,b) => a.title.localeCompare(b.title));
    const typeChips = ["all","movie","tv","anime"].map(k =>
      '<button class="chip ' + (type===k?"on":"") + '" onclick="CINE.exp(\''+k+'\',\''+genre+'\',\''+sort+'\')">' + (k==="all"?"All":k==="movie"?"Movies":k==="tv"?"TV":"Anime") + '</button>').join("");
    const gchips = DATA.genres.map(g => '<button class="chip ' + (genre===g?"on":"") + '" onclick="CINE.exp(\''+type+'\',\''+g+'\',\''+sort+'\')">'+g+'</button>').join("");
    return '<main class="page" style="max-width:1200px"><h1>Explore</h1>'
      + '<p class="count">' + list.length + " titles in the catalogue</p>"
      + '<div class="toolbar"><div class="chips">' + typeChips + '</div>'
      + '<select onchange="CINE.exp(\''+type+'\',\''+genre+'\',this.value)">'
      + '<option value="rating"' + (sort==="rating"?" selected":"") + '>Sort: Rating</option>'
      + '<option value="year"' + (sort==="year"?" selected":"") + '>Sort: Newest first</option>'
      + '<option value="az"' + (sort==="az"?" selected":"") + '>Sort: A&#8594;Z</option></select></div>'
      + '<div class="chips" style="margin-bottom:22px">' + gchips + '</div>'
      + '<div class="grid">' + list.map(posterCard).join("") + '</div></main>';
  }

  function searchView(q){
    q = (q || "").trim().toLowerCase();
    const list = q ? DATA.titles.filter(t => t.title.toLowerCase().includes(q) || t.genres.some(g => g.toLowerCase().includes(q))) : [];
    return '<main class="page" style="max-width:1200px"><h1>Search</h1>'
      + (q ? '<p class="count" style="margin-top:4px">' + list.length + ' results for &ldquo;' + esc(q) + '&rdquo;</p>' : "")
      + (list.length ? '<div class="grid" style="margin-top:22px">' + list.map(posterCard).join("") + '</div>'
        : '<div class="empty">No titles found.<b>Try &ldquo;Inception&rdquo;, &ldquo;Breaking Bad&rdquo; or &ldquo;Spirited Away&rdquo;.</b></div>')
      + '</main>';
  }

  function reviewBlock(t){
    const u = currentUser();
    const r = (u && ratingsOf(u.username)[t.id]) || null;
    const score = r ? r.score : null;
    let pills = "";
    for (let i = 1; i <= 10; i++){ pills += '<button class="pill ' + (score===i?"sel":"") + '" onclick="CINE.pick(\'' + t.id + '\',' + i + ')">' + i + '</button>'; }
    const others = users.filter(x => x.username !== (u && u.username)).map(x => {
      const rr = ratingsOf(x.username)[t.id]; return { user: x, r: rr };
    }).filter(x => x.r && x.r.score);
    const reviews = others.map(x => x.r.review ? '<div class="rv"><b>' + esc(x.user.username) + '</b> rating ' + x.r.score + '/10 &middot; ' + esc(x.r.review) + '</div>' : "").filter(Boolean);
    return '<div class="widget" id="widget">'
      + '<h3 style="margin:0">Rate this title</h3>'
      + '<div class="scorebox"><div class="score-item"><div class="big">' + (score ? score : "&ndash;") + '</div><div class="lbl">' + (score ? "Your rating" : "Not rated yet") + '</div></div>'
      + '<div class="score-item"><div class="big">' + scoreOf(t).toFixed(1) + '</div><div class="lbl">Community score</div></div></div>'
      + '<div class="starline">' + (score ? stars(score) : "&#9733;&#9733;&#9733;&#9733;&#9733;") + '</div>'
      + '<div class="pills">' + pills + '</div>'
      + '<textarea id="review" placeholder="Write a short review (optional)…">' + esc(r && r.review ? r.review : "") + '</textarea>'
      + '<button class="btn btn-primary save" onclick="CINE.save(\'' + t.id + '\')" style="color:#fff">' + (score ? "Update rating" : "Save rating") + '</button>'
      + (score ? '<button class="btn btn-ghost save" onclick="CINE.pick(\''+t.id+'\',0)" style="margin-left:8px">Remove</button>' : "")
      + '</div>'
      + (reviews.length ? '<div class="widget" style="margin-top:14px"><h3 style="margin:0 0 10px">Latest reviews</h3><div class="reviews-list">' + reviews.join("") + '</div></div>' : "");
  }

  function detailView(id){
    const t = byId(id);
    if (!t) return '<main class="page" style="max-width:1200px"><div class="empty">404<b>Title not found.</b></div></main>';
    const related = DATA.titles.filter(x => x.id !== t.id && x.genres.some(g => t.genres.includes(g))).slice(0, 8);
    const wOn = currentUser() && watchOf(currentUser().username).includes(t.id);
    const buy = currentUser() ? '<button class="btn btn-primary" style="color:#fff" onclick="CINE.toggleW(\'' + t.id + '\')">' + (wOn ? "&#10003; In watchlist" : "+ Watchlist") + '</button>'
      : '<a class="btn btn-primary" style="color:#fff" href="#/login?next=title/' + t.id + '">Log in to watchlist</a>';
    return '<main class="page" style="max-width:1200px">'
      + '<a class="back" href="#/explore">&larr; Back to explore</a>'
      + '<div class="detail-hero"><div class="bg" style="background-image:url(\''+t.backdrop+'\')"></div><div class="shade"></div>'
      + '<div class="detail-head"><img src="' + t.poster + '" alt="' + esc(t.title) + '">'
      + '<div><h1>' + esc(t.title) + '</h1>'
      + '<div class="meta"><span class="chip2">' + t.year + '</span><span class="chip2">' + (t.runtime || "N/A") + '</span>'
      + t.genres.map(g => '<span class="chip2">' + g + '</span>').join("") + '</div>'
      + '<div class="hero-cta" style="margin-top:16px;margin-bottom:0">' + buy + '</div>'
      + '</div></div></div>'
      + '<div class="detail-body"><div>'
      + '<h3>Overview</h3>' + (t.tagline ? '<p class="tagline">"'+esc(t.tagline)+'"</p>' : "")
      + '<p class="overview">' + esc(t.overview) + '</p>'
      + '<h3>Cast</h3><div class="cast">' + t.cast.map(c => '<span><b>' + esc(c.name) + '</b><i>' + esc(c.role) + '</i></span>').join("") + '</div>'
      + '<h3>You might also like</h3><div class="row" style="padding-bottom:6px">' + related.map(posterCard).join("") + '</div>'
      + '</div><div>' + reviewBlock(t) + '</div></div></main>';
  }

  function authView(kind, next, error){
    const isLogin = kind === "login";
    const colorBtns = AVATAR_COLORS.map((c,i) => '<button type="button" class="' + (i===2?"on":"") + '" style="background:' + c + '" onclick="CINE.color(this,' + i + ')"></button>').join("");
    return '<div class="auth-wrap"><div class="auth-card">'
      + '<h1><span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">Cine</span>Verse</h1>'
      + '<p class="sub">' + (isLogin ? "Welcome back — log in to continue" : "Create your free account") + '</p>'
      + (error ? '<div class="err">' + esc(error) + '</div>' : "")
      + (isLogin
          ? '<div class="field"><label for="fLoginUser">Username or email</label><input id="fLoginUser" autocomplete="username"></div>'
            + '<div class="field"><label for="fLoginPass">Password</label><input id="fLoginPass" type="password" autocomplete="current-password"></div>'
            + '<button class="btn btn-primary btn-block" style="color:#fff" onclick="CINE.doLogin(\'' + esc(next) + '\')">Log in</button>'
          : '<div class="field"><label for="fUser">Username</label><input id="fUser" autocomplete="username"></div>'
            + '<div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" autocomplete="email"></div>'
            + '<div class="field"><label for="fPass">Password</label><input id="fPass" type="password" autocomplete="new-password"></div>'
            + '<div class="field"><label>Avatar colour</label><div class="colors">' + colorBtns + '</div></div>'
            + '<button class="btn btn-primary btn-block" style="color:#fff" onclick="CINE.doRegister(\'' + esc(next) + '\')">Create account</button>')
      + '<p class="auth-switch">' + (isLogin ? "New to CineVerse? <a href=\"#/signup\">Create an account</a>" : "Already have an account? <a href=\"#/login\">Log in</a>") + '</p>'
      + '</div></div>';
  }

  function watchlistView(){
    const u = currentUser();
    const list = watchOf(u.username).map(byId).filter(Boolean);
    return '<main class="page" style="max-width:1200px"><h1>My watchlist</h1>'
      + '<p class="count">' + list.length + ' saved titles</p>'
      + (list.length ? '<div class="grid" style="margin-top:22px">' + list.map(posterCard).join("") + '</div>'
        : '<div class="empty">Nothing saved yet.<b>Tap the &#10084; on any poster to build a watchlist.</b></div>')
      + '</main>';
  }

  function accountView(){
    const u = currentUser();
    const rt = ratingsOf(u.username);
    const keys = Object.keys(rt);
    const avgs = keys.map(k => rt[k].score).filter(s => s);
    const avg = avgs.length ? (avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(1) : "&ndash;";
    const reviews = keys.filter(k => rt[k].review).length;
    const recent = keys.sort((a,b) => (rt[b].updated||0)-(rt[a].updated||0)).slice(0,5).map(id => {
      const t = byId(id); if (!t) return "";
      return '<div class="rv"><img src="' + t.poster + '" alt="">'
        + '<div style="flex:1"><div class="tt">' + esc(t.title) + '</div>' + (rt[id].review ? '<div class="rvw">' + esc(rt[id].review) + '</div>' : "") + '</div>'
        + '<span class="sc">' + (rt[id].score||"-") + '/10</span></div>';
    }).join("");
    const colors = AVATAR_COLORS.map(c => '<button type="button" class="' + (u.color===c?"on":"") + '" style="background:' + c + '" onclick="CINE.color(this)"></button>').join("");
    return '<main class="page" style="max-width:1200px"><h1>My account</h1>'
      + '<p class="count">Signed in as ' + esc(u.username) + '</p>'
      + '<div class="account-head"><div class="avatar" style="background:' + u.color + '">' + initials(u.username) + '</div>'
      + '<div><h2 style="font-size:20px">' + esc(u.username) + '</h2><p class="count">' + esc(u.email) + '</p></div></div>'
      + '<div class="stats-grid">'
      + '<div class="stat"><div class="num">' + avgs.length + '</div><div class="lbl">Ratings</div></div>'
      + '<div class="stat"><div class="num">' + avg + '</div><div class="lbl">Average rating</div></div>'
      + '<div class="stat"><div class="num">' + reviews + '</div><div class="lbl">Reviews</div></div>'
      + '<div class="stat"><div class="num">' + watchOf(u.username).length + '</div><div class="lbl">Watchlist</div></div>'
      + '</div>'
      + '<div class="account-body"><div><div class="panel"><h3>Profile</h3>'
      + '<div class="field"><label for="fBio">Bio</label><textarea id="fBio" class="ta">' + esc(u.bio || "") + '</textarea></div>'
      + '<div class="field"><label>Avatar colour</label><div class="colors">' + colors + '</div></div>'
      + '<div class="field"><label for="fNewPass">New password (leave blank to keep)</label><input id="fNewPass" type="password" autocomplete="new-password"></div>'
      + '<button class="btn btn-primary" style="color:#fff" onclick="CINE.doSaveAccount()">Save changes</button>'
      + '</div></div>'
      + '<div><div class="panel"><h3>Recent ratings</h3>'
      + (recent ? '<div class="recent">' + recent + '</div>' : '<p class="count">No ratings yet — rate a title from its page.</p>')
      + '</div>'
      + '<div class="panel" style="margin-top:16px;border-color:rgba(244,63,94,.35)"><h3 style="color:#fda4af">Danger zone</h3>'
      + '<p class="count" style="margin-bottom:12px">Deleting your account removes your ratings and watchlist permanently.</p>'
      + '<button class="btn btn-danger" onclick="CINE.doDeleteAccount()">Delete account</button>'
      + '</div></div></div></main>';
  }

  let heroIdx = 0, heroTimer = null;
  function startHero(){
    const heroEl = document.querySelector(".hero");
    if (!heroEl) return;
    const slides = DATA.titles.filter(t => t.featured).slice(0, 5);
    const pool = slides.length ? slides : DATA.titles.slice(0, 5);
    const render = () => {
      heroEl.innerHTML = heroHTML(pool, heroIdx);
      heroEl.querySelectorAll(".hero-dots button").forEach((d, k) => d.onclick = () => { heroIdx = k; render(); });
    };
    if (heroTimer) clearInterval(heroTimer);
    heroTimer = setInterval(() => { heroIdx = (heroIdx + 1) % pool.length; render(); }, 7000);
    render();
  }

  function route(){
    const h = location.hash.slice(2) || "";
    const path = h.split("?")[0];
    const u = currentUser();
    let next = "";
    const q = (h.split("?")[1] || "");
    const params = new URLSearchParams(q);
    if (params.get("next")) next = params.get("next");

    if (path === "login"){ $("#app").innerHTML = authView("login", next); }
    else if (path === "signup"){ $("#app").innerHTML = authView("signup", next); }
    else if (path === "account" || path === "watchlist"){
      if (!u){ location.hash = "#/login?next=" + encodeURIComponent(path); return; }
      $("#app").innerHTML = path === "account" ? accountView() : watchlistView();
    }
    else if (path.indexOf("title/") === 0){ $("#app").innerHTML = detailView(path.slice(6)); }
    else if (path.indexOf("search") === 0){ $("#app").innerHTML = searchView(params.get("q")); }
    else if (path.indexOf("explore") === 0){ $("#app").innerHTML = exploreView(params.get("type"), params.get("genre"), params.get("sort")); }
    else { $("#app").innerHTML = homeView(); startHero(); }
    renderNav();
    window.scrollTo(0, 0);
  }

  window.CINE = {
    goTitle: id => { location.hash = "#/title/" + id; },
    exp: (type, genre, sort) => { location.hash = "#/explore?type=" + (type||"all") + "&genre=" + (genre||"") + "&sort=" + (sort||"rating"); },
    menuToggle: e => { e.stopPropagation(); const m = document.getElementById("menu"); m.style.display = m.style.display === "none" ? "block" : "none"; },
    color: (btn, idx) => {
      const root = btn.closest(".colors"); root.querySelectorAll(".on").forEach(b => b.classList.remove("on")); btn.classList.add("on");
      const field = document.getElementById("fAvatarColor"); if (field) field.value = AVATAR_COLORS[idx];
    },
    toggleW: id => {
      const u = currentUser();
      if (!u){ location.hash = "#/login?next=title/" + id; return; }
      const w = watchOf(u.username);
      const i = w.indexOf(id);
      i > -1 ? w.splice(i,1) : w.push(id);
      saveWatch(u.username, w); route();
    },
    pick: (id, v) => {
      const u = currentUser();
      if (!u){ location.hash = "#/login?next=title/" + id; return; }
      const r = ratingsOf(u.username);
      if (v === 0){ delete r[id]; } else { r[id] = { score: v, review: (r[id] && r[id].review) || "", updated: Date.now() }; }
      saveRatings(u.username, r);
      $("#widget").outerHTML = reviewBlock(byId(id));
    },
    save: id => {
      const u = currentUser();
      if (!u){ location.hash = "#/login?next=title/" + id; return; }
      const r = ratingsOf(u.username);
      const cur = r[id] || {};
      r[id] = { score: cur.score, review: document.getElementById("review").value, updated: Date.now() };
      saveRatings(u.username, r);
      $("#widget").outerHTML = reviewBlock(byId(id));
    },
    doRegister: next => {
      const username = document.getElementById("fUser").value.trim();
      const email = document.getElementById("fEmail").value.trim();
      const pass = document.getElementById("fPass").value;
      const color = document.querySelector(".colors .on") ? document.querySelector(".colors .on").style.background : AVATAR_COLORS[0];
      if (username.length < 3){ return $("#app").innerHTML = authView("signup", next, "Username must be at least 3 characters."); }
      if (!/^\S+@\S+\.\S+$/.test(email)){ return $("#app").innerHTML = authView("signup", next, "Enter a valid email address."); }
      if (pass.length < 6){ return $("#app").innerHTML = authView("signup", next, "Password must be at least 6 characters."); }
      const uname = username.toLowerCase(), umail = email.toLowerCase();
      if (users.some(x => x.username.toLowerCase() === uname || x.email.toLowerCase() === umail)){ return $("#app").innerHTML = authView("signup", next, "That username or email is already taken."); }
      users.push({ username, email, color, bio: "", pw: hashPw(pass), created: Date.now() });
      saveUsers(); setSession(username); startHeroStop();
      location.hash = next ? "#/" + next.replace(/^#\//, "") : "#/";
    },
    doLogin: next => {
      const who = document.getElementById("fLoginUser").value.trim();
      const pass = document.getElementById("fLoginPass").value;
      const low = who.toLowerCase();
      const user = users.find(x => x.username.toLowerCase() === low || x.email.toLowerCase() === low);
      if (!user || user.pw !== hashPw(pass)){ return $("#app").innerHTML = authView("login", next, "Invalid username or password."); }
      setSession(user.username); startHeroStop();
      location.hash = next ? "#/" + next.replace(/^#\//, "") : "#/";
    },
    logout: () => { setSession(""); location.hash = "#/"; },
    doSaveAccount: () => {
      const u = currentUser();
      u.bio = document.getElementById("fBio").value;
      const np = document.getElementById("fNewPass").value;
      const col = document.querySelector(".colors .on"); if (col) u.color = col.style.background;
      if (np){ if (np.length < 6){ $("#fNewPass").style.borderColor = "#f43f5e"; return; } u.pw = hashPw(np); }
      saveUsers(); route();
    },
    doDeleteAccount: () => {
      if (!confirm("Delete your CineVerse account? This cannot be undone.")) return;
      const u = currentUser();
      users.splice(users.indexOf(u), 1); saveUsers();
      localStorage.removeItem("cv.r." + u.username); localStorage.removeItem("cv.w." + u.username);
      setSession(""); location.hash = "#/";
    }
  };

  function startHeroStop(){ if (heroTimer){ clearInterval(heroTimer); heroTimer = null; } }

  window.addEventListener("hashchange", route);
  route();
})();
</script></body></html>
